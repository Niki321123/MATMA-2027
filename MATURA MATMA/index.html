<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Zadań Maturalnych — Matematyka Rozszerzona</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- App CSS -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">∑</span>
      <div class="logo-text">
        <span class="logo-title">Matura Matma</span>
        <span class="logo-sub">Matematyka Rozszerzona 2027</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost btn-sm" id="btn-progress-open" title="Statystyki">
        <span>📊</span> Postępy
      </button>
      <!-- Stan: niezalogowany -->
      <button class="btn btn-outline btn-sm" id="btn-auth-open" title="Zaloguj się">
        Zaloguj się
      </button>
      <!-- Stan: zalogowany (ukryty domyślnie) -->
      <button class="btn btn-ghost btn-sm user-btn hidden" id="btn-user-menu" title="Konto">
        <span class="user-avatar" id="user-avatar">?</span>
        <span class="user-email-short" id="user-email-short"></span>
      </button>
    </div>
  </div>
</header>

<!-- PANEL TRYBÓW -->
<div class="mode-tabs-wrapper">
  <div class="mode-tabs" id="mode-tabs">
    <button class="mode-tab active" data-mode="generator">⚡ Generator zadań</button>
    <button class="mode-tab" data-mode="symulacja">🎓 Symulacja matury</button>
  </div>
</div>

<!-- PANEL KONTROLNY - GENERATOR -->
<div class="control-panel" id="control-panel-generator">
  <div class="control-panel-inner">

    <div class="control-group">
      <label class="control-label" for="select-category">Kategoria</label>
      <select class="select" id="select-category">
        <option value="0">🎲 Losowa kategoria</option>
      </select>
    </div>

    <button class="btn btn-primary" id="btn-generate">⚡ Generuj zadanie</button>
  </div>
</div>

<!-- PANEL KONTROLNY - MATURA -->
<div class="control-panel hidden" id="control-panel-matura">
  <div class="control-panel-inner">

    <div class="control-group">
      <label class="control-label" for="select-year">Rok matury</label>
      <select class="select" id="select-year">
        <option value="0">🎲 Wszystkie lata</option>
      </select>
    </div>

    <div class="control-group">
      <label class="control-label" for="select-matura-task">Zadanie</label>
      <select class="select" id="select-matura-task">
        <option value="">— wybierz zadanie —</option>
      </select>
    </div>

    <button class="btn btn-primary" id="btn-load-matura">📖 Wczytaj zadanie</button>
    <button class="btn btn-ghost" id="btn-random-matura">🎲 Losuj</button>
  </div>
</div>

<!-- PANEL KONTROLNY - SYMULACJA -->
<div class="control-panel hidden" id="control-panel-symulacja">
  <div class="control-panel-inner">
    <button class="btn btn-primary" id="btn-start-exam">🎓 Generuj arkusz (12 zadań)</button>
  </div>
</div>

<!-- PASEK NAWIGACJI ARKUSZA (widoczny tylko w trybie symulacja) -->
<div class="exam-nav hidden" id="exam-nav">
  <div class="exam-nav-inner">
    <div class="exam-nav-pills" id="exam-nav-pills"></div>
    <div class="exam-nav-score" id="exam-nav-score"></div>
  </div>
</div>

<!-- MAIN CONTENT -->
<main class="main-layout">

  <!-- KARTA ZADANIA -->
  <section class="task-section">

    <!-- Karta zadania -->
    <div class="task-card hidden" id="task-card">

      <!-- Nagłówek karty -->
      <div class="task-header">
        <div class="task-meta">
          <span class="task-category-badge" id="task-badge">Kat. 1</span>
          <span class="task-points-badge" id="task-points">4 pkt</span>
          <span class="task-source-badge hidden" id="task-source">Matura 2024 z.5</span>
        </div>
      </div>

      <!-- Treść zadania -->
      <div class="task-statement" id="task-statement">
      </div>

      <!-- Strefa wskazówek -->
      <div class="hints-zone">
        <button class="btn btn-hint" id="btn-hint">
          💡 Pokaż wskazówkę (1/3)
        </button>
        <div class="hints-list" id="hints-list"></div>
      </div>

      <!-- Strefa akcji -->
      <div class="answer-zone">
        <div class="answer-buttons">
          <button class="btn btn-ghost" id="btn-show-solution">
            📖 Pokaż rozwiązanie
          </button>
          <button class="btn btn-success-outline hidden" id="btn-self-correct">
            ✓ Rozwiązałem poprawnie
          </button>
          <button class="btn btn-danger-outline hidden" id="btn-self-wrong">
            ✗ Nie rozwiązałem
          </button>
          <button class="btn btn-primary hidden" id="btn-next">
            ↻ Następne zadanie
          </button>
        </div>
      </div>

    </div>

    <!-- Panel rozwiązania -->
    <div class="solution-panel hidden" id="solution-panel">
      <div class="solution-header">
        <h3 class="solution-title">Rozwiązanie krok po kroku</h3>
        <div class="solution-answer-box" id="answer-display"></div>
      </div>
      <div class="solution-steps" id="solution-steps"></div>
    </div>

  </section>

  <!-- SIDEBAR POSTĘPÓW -->
  <aside class="progress-sidebar" id="progress-sidebar">
    <div class="sidebar-placeholder">
      <p>Rozwiąż pierwsze zadanie, aby zobaczyć postępy.</p>
    </div>
  </aside>

</main>

<!-- MODAL STATYSTYK -->
<div class="modal-overlay hidden" id="modal-progress">
  <div class="modal">
    <div class="modal-header">
      <h2>Statystyki</h2>
      <button class="modal-close" id="btn-progress-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- APP SCRIPTS — kolejność ma znaczenie! -->
<script src="js/core/MathUtils.js"></script>
<script src="js/core/KatexRenderer.js"></script>
<script src="js/core/AnswerChecker.js"></script>
<script src="js/core/ProgressTracker.js"></script>
<script src="js/generators/cat01_exp_praktyka.js"></script>
<script src="js/generators/cat02_granica.js"></script>
<script src="js/generators/cat03_logarytmy.js"></script>
<!-- MODAL: AUTH -->
<div class="modal-overlay hidden" id="modal-auth">
  <div class="modal-box auth-modal">
    <button class="modal-close" id="btn-auth-close">✕</button>
    <div class="auth-logo">∑</div>
    <h2 class="auth-title" id="auth-modal-title">Zaloguj się</h2>
    <p class="auth-subtitle" id="auth-modal-sub">Zapisuj postępy w chmurze na wszystkich urządzeniach.</p>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Logowanie</button>
      <button class="auth-tab" data-tab="register">Rejestracja</button>
    </div>

    <!-- Form -->
    <form class="auth-form" id="auth-form" autocomplete="on">
      <div class="auth-field">
        <label class="auth-label" for="auth-email">Email</label>
        <input class="auth-input" id="auth-email" type="email" placeholder="twoj@email.pl" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label class="auth-label" for="auth-password">Hasło</label>
        <input class="auth-input" id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div class="auth-error hidden" id="auth-error"></div>
      <button class="btn btn-primary auth-submit" id="auth-submit" type="submit">Zaloguj się</button>
    </form>

  </div>
</div>

<!-- MODAL: USER MENU -->
<div class="modal-overlay hidden" id="modal-user">
  <div class="modal-box user-modal">
    <button class="modal-close" id="btn-user-close">✕</button>
    <div class="user-modal-avatar" id="um-avatar">?</div>
    <div class="user-modal-email" id="um-email"></div>
    <div class="user-modal-sync" id="um-sync-status">✓ Statystyki synchronizowane</div>
    <button class="btn btn-danger btn-sm" id="btn-logout" style="margin-top:20px;width:100%">Wyloguj się</button>
  </div>
</div>

<script src="js/generators/cat04_styczna.js"></script>
<script src="js/generators/cat05_dowod_nierownosci.js"></script>
<script src="js/generators/cat06_nierownoscabs.js"></script>
<script src="js/generators/cat07_ciagi.js"></script>
<script src="js/generators/cat08_planimetria.js"></script>
<script src="js/generators/cat09_tryg_rownanie.js"></script>
<script src="js/generators/cat10_stereometria.js"></script>
<script src="js/generators/cat11_analityczna.js"></script>
<script src="js/generators/cat12_param_kwadratowe.js"></script>
<script src="js/generators/cat13_bernoulli.js"></script>
<script src="js/generators/cat14_kombinatoryka.js"></script>
<script src="js/generators/cat15_optymalizacja.js"></script>
<script src="js/generators/index.js?v=20260519"></script>
<script src="js/data/matura_tasks.js?v=20260519"></script>
<script src="js/core/SupabaseAuth.js?v=20260519"></script>
<script src="js/app.js?v=20260519"></script>

</body>
</html>
